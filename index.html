<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Parked business and project ideas for O'keito S. with AI jumpstart prompts">
    <link rel="icon" href="data:,">
    <title>Project Ideas | O'keito S.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #06080f;
            --bg-panel: rgba(12, 18, 32, 0.72);
            --bg-card: rgba(14, 22, 40, 0.55);
            --bg-card-hover: rgba(18, 28, 50, 0.75);
            --text-primary: #e8edf7;
            --text-secondary: #8b9bb8;
            --text-muted: #5c6b85;
            --border: rgba(0, 240, 255, 0.12);
            --border-bright: rgba(0, 240, 255, 0.35);
            --accent: #00f0ff;
            --accent-dim: rgba(0, 240, 255, 0.15);
            --accent-hover: #33f5ff;
            --accent-glow: rgba(0, 240, 255, 0.25);
            --magenta: #c850ff;
            --success: #3dffa8;
            --tag-bg: rgba(0, 240, 255, 0.08);
            --tag-text: #a8d4e8;
            --status-new: #ffd166;
            --status-parked: #8b9bb8;
            --status-active: #00f0ff;
            --status-done: #3dffa8;
            --card-height: 220px;
            --panel-width: min(480px, 100vw);
            --font-sans: 'Outfit', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        body {
            font-family: var(--font-sans);
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-deep);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        body.panel-open {
            overflow: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 36px 0 28px;
            margin-bottom: 28px;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.04) 0%, transparent 100%);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 52ch;
        }

        .controls {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 20px;
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.04);
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .search-wrap {
            position: relative;
            flex: 0 0 280px;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 11px;
            width: 16px;
            height: 16px;
            color: var(--accent);
            opacity: 0.7;
            pointer-events: none;
            transform: translateY(-50%);
        }

        .search-box {
            width: 100%;
            height: 40px;
            padding: 8px 36px 8px 34px;
            font-size: 0.9rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(6, 8, 15, 0.6);
            color: var(--text-primary);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .search-box:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--border-bright);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .clear-search {
            position: absolute;
            top: 50%;
            right: 4px;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.15rem;
            line-height: 1;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .clear-search:hover {
            color: var(--accent);
            background-color: var(--accent-dim);
        }

        .clear-search:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 0;
        }

        .filter-scroll-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .filter-scroll-wrap::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 28px;
            height: 100%;
            background: linear-gradient(to right, transparent, var(--bg-panel));
            pointer-events: none;
        }

        .filter-scroll {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding-right: 24px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-bright) transparent;
        }

        .filters {
            display: flex;
            gap: 7px;
            flex: 0 0 auto;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .filter-label {
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            align-self: center;
        }

        .filter-btn {
            min-height: 32px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(6, 8, 15, 0.5);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--border-bright);
            color: var(--text-primary);
            background: var(--accent-dim);
        }

        .filter-btn.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .filter-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .results-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-count {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-family: var(--font-mono);
            letter-spacing: 0.02em;
        }

        .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .idea-card {
            height: var(--card-height);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            display: flex;
            flex-direction: column;
        }

        .idea-card:hover {
            border-color: var(--border-bright);
            background: var(--bg-card-hover);
            box-shadow: 0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .idea-card.is-selected {
            border-color: var(--accent);
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .card-face {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 18px 20px 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .idea-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
            flex: 1;
            min-width: 0;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
            flex-shrink: 0;
            border: 1px solid transparent;
        }

        .status-parked {
            background: rgba(139, 155, 184, 0.15);
            color: var(--status-parked);
            border-color: rgba(139, 155, 184, 0.3);
        }

        .status-new {
            background: rgba(255, 209, 102, 0.12);
            color: var(--status-new);
            border-color: rgba(255, 209, 102, 0.35);
        }

        .status-active {
            background: rgba(0, 240, 255, 0.12);
            color: var(--status-active);
            border-color: rgba(0, 240, 255, 0.35);
        }

        .status-done {
            background: rgba(61, 255, 168, 0.12);
            color: var(--status-done);
            border-color: rgba(61, 255, 168, 0.35);
        }

        .idea-summary {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            flex: 1;
            min-height: 0;
        }

        .read-more-btn {
            align-self: flex-start;
            margin-top: 12px;
            padding: 8px 16px;
            border: 1px solid var(--border-bright);
            border-radius: 6px;
            background: transparent;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .read-more-btn:hover {
            background: var(--accent-dim);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .read-more-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--border);
        }

        .source-link {
            color: var(--accent);
            text-decoration: none;
        }

        .source-link:hover {
            text-decoration: underline;
        }

        /* Detail panel */
        .panel-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 4, 10, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s;
        }

        .panel-backdrop.is-open {
            opacity: 1;
            visibility: visible;
        }

        .detail-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--panel-width);
            height: 100%;
            max-height: 100dvh;
            background: rgba(8, 12, 22, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border-bright);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5), -4px 0 24px var(--accent-glow);
            z-index: 101;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-panel.is-open {
            transform: translateX(0);
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-primary);
            padding-right: 8px;
        }

        .panel-close {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(6, 8, 15, 0.6);
            color: var(--text-secondary);
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .panel-close:hover {
            color: var(--accent);
            border-color: var(--border-bright);
        }

        .panel-close:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 32px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-bright) transparent;
        }

        .panel-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .idea-meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .meta-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meta-label {
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            min-width: 4.5rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tag {
            padding: 5px 12px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 500;
            font-family: var(--font-mono);
        }

        .prompt-section {
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .prompt-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .copy-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(200, 80, 255, 0.15) 100%);
            color: var(--accent);
            border: 1px solid var(--border-bright);
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: box-shadow 0.2s, background 0.2s;
        }

        .copy-btn:hover {
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .copy-btn.copied {
            background: rgba(61, 255, 168, 0.2);
            color: var(--success);
            border-color: rgba(61, 255, 168, 0.5);
        }

        .copy-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .prompt-code {
            background: rgba(4, 6, 12, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: 1.55;
            max-height: min(50vh, 400px);
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .controls-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            .search-wrap,
            .filter-scroll-wrap {
                flex: 1 0 100%;
                width: 100%;
            }

            .ideas-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }

            :root {
                --card-height: 200px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .filter-btn,
            .idea-card,
            .detail-panel,
            .panel-backdrop {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Project Ideas</h1>
            <p class="subtitle">Parked business and project ideas for O'keito S. (Melbourne UX/product designer)</p>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="controls-row">
                <div class="search-wrap">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                    <input
                        type="search"
                        id="searchInput"
                        class="search-box"
                        placeholder="Search ideas..."
                        aria-label="Search ideas by title, summary, or tags"
                        autocomplete="off"
                    >
                    <button class="clear-search" id="clearSearch" type="button" aria-label="Clear search" hidden>&times;</button>
                </div>

                <div class="filter-scroll-wrap">
                    <div class="filter-scroll" aria-label="Idea filters">
                        <div class="filters">
                            <span class="filter-label">Status:</span>
                            <div class="filter-group" id="statusFilters">
                                <button class="filter-btn active" data-status="all" aria-pressed="true">All</button>
                                <button class="filter-btn" data-status="new" aria-pressed="false">New / to start</button>
                                <button class="filter-btn" data-status="parked" aria-pressed="false">Parked</button>
                                <button class="filter-btn" data-status="active" aria-pressed="false">Active</button>
                                <button class="filter-btn" data-status="done" aria-pressed="false">Done</button>
                            </div>
                        </div>

                        <div class="filters">
                            <span class="filter-label">Tags:</span>
                            <div class="filter-group" id="tagFilters">
                                <button class="filter-btn active" data-tag="all" aria-pressed="true">All</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="results-toolbar">
            <div class="results-count" id="resultsCount"></div>
        </div>

        <div class="ideas-grid" id="ideasGrid"></div>
    </div>

    <footer>
        <p>Stack: Marvelus AI voice, Nolostsales, AI agents, App Store products, land, sandwich boards</p>
        <p>Site: <a href="https://marvelus-tech.github.io/project-ideas/" class="source-link">marvelus-tech.github.io/project-ideas</a></p>
    </footer>

    <div class="panel-backdrop" id="panelBackdrop" hidden></div>
    <aside
        class="detail-panel"
        id="detailPanel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="panelTitle"
        hidden
    >
        <div class="panel-header">
            <h2 class="panel-title" id="panelTitle"></h2>
            <button type="button" class="panel-close" id="panelClose" aria-label="Close details">&times;</button>
        </div>
        <div class="panel-body" id="panelBody"></div>
    </aside>

    <script>
        let allIdeas = [];
        let currentFilters = {
            search: '',
            status: 'all',
            tag: 'all'
        };
        let selectedIdeaId = null;
        let previousFocus = null;
        let panelOpen = false;

        const panelEl = document.getElementById('detailPanel');
        const backdropEl = document.getElementById('panelBackdrop');
        const panelTitleEl = document.getElementById('panelTitle');
        const panelBodyEl = document.getElementById('panelBody');
        const panelCloseEl = document.getElementById('panelClose');

        const FOCUSABLE = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';

        async function loadIdeas() {
            try {
                const response = await fetch('data/ideas.json');
                const data = await response.json();
                allIdeas = data.ideas;

                const allTags = new Set();
                allIdeas.forEach(idea => {
                    idea.tags.forEach(tag => allTags.add(tag));
                });

                const tagFiltersContainer = document.getElementById('tagFilters');
                const sortedTags = Array.from(allTags).sort();
                sortedTags.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.tag = tag;
                    btn.textContent = tag;
                    btn.setAttribute('aria-pressed', 'false');
                    tagFiltersContainer.appendChild(btn);
                });

                renderIdeas();
            } catch (error) {
                console.error('Error loading ideas:', error);
                document.getElementById('ideasGrid').innerHTML =
                    '<div class="empty-state"><h2>Error loading ideas</h2><p>Please check the console for details.</p></div>';
            }
        }

        function filterIdeas() {
            return allIdeas.filter(idea => {
                if (currentFilters.search) {
                    const searchLower = currentFilters.search.toLowerCase();
                    const matchesSearch =
                        idea.title.toLowerCase().includes(searchLower) ||
                        idea.summary.toLowerCase().includes(searchLower) ||
                        idea.tags.some(tag => tag.toLowerCase().includes(searchLower));
                    if (!matchesSearch) return false;
                }

                if (currentFilters.status !== 'all' && idea.status !== currentFilters.status) {
                    return false;
                }

                if (currentFilters.tag !== 'all' && !idea.tags.includes(currentFilters.tag)) {
                    return false;
                }

                return true;
            });
        }

        function getStatusLabel(status) {
            return status === 'new' ? 'new / to start' : status;
        }

        function closePanel() {
            if (!panelOpen) return;
            panelOpen = false;
            selectedIdeaId = null;
            panelEl.classList.remove('is-open');
            backdropEl.classList.remove('is-open');
            document.body.classList.remove('panel-open');
            panelEl.hidden = true;
            backdropEl.hidden = true;
            document.querySelectorAll('.idea-card.is-selected').forEach(c => c.classList.remove('is-selected'));
            if (previousFocus && typeof previousFocus.focus === 'function') {
                previousFocus.focus();
            }
            previousFocus = null;
        }

        function getPanelFocusables() {
            return Array.from(panelEl.querySelectorAll(FOCUSABLE)).filter(
                el => !el.disabled && el.offsetParent !== null
            );
        }

        function trapPanelFocus(e) {
            if (!panelOpen || e.key !== 'Tab') return;
            const focusables = getPanelFocusables();
            if (focusables.length === 0) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        }

        function populatePanel(idea) {
            panelTitleEl.textContent = idea.title;
            panelBodyEl.innerHTML = `
                <p class="panel-summary">${escapeHtml(idea.summary)}</p>
                <div class="idea-meta">
                    <div class="meta-row">
                        <span class="meta-label">Status</span>
                        <span class="status-badge status-${idea.status}">${escapeHtml(getStatusLabel(idea.status))}</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Source</span>
                        <a href="${escapeHtml(idea.source)}" class="source-link" target="_blank" rel="noopener">${escapeHtml(idea.sourceLabel)}</a>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Saved</span>
                        <span>${escapeHtml(idea.savedAt)}</span>
                    </div>
                </div>
                <div class="tags">
                    ${idea.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                </div>
                <div class="prompt-section">
                    <div class="prompt-header">
                        <span class="prompt-label">AI Jumpstart Prompt</span>
                        <button type="button" class="copy-btn" data-copy-prompt data-idea-id="${escapeHtml(idea.id)}">Copy prompt</button>
                    </div>
                    <div class="prompt-code" id="panelPromptCode">${escapeHtml(idea.jumpstartPrompt)}</div>
                </div>
            `;
        }

        function openPanel(ideaId) {
            const idea = allIdeas.find(i => i.id === ideaId);
            if (!idea) return;

            previousFocus = document.activeElement;
            selectedIdeaId = ideaId;
            populatePanel(idea);

            document.querySelectorAll('.idea-card.is-selected').forEach(c => c.classList.remove('is-selected'));
            const card = document.querySelector(`.idea-card[data-idea-id="${CSS.escape(ideaId)}"]`);
            if (card) card.classList.add('is-selected');

            panelEl.hidden = false;
            backdropEl.hidden = false;
            requestAnimationFrame(() => {
                panelEl.classList.add('is-open');
                backdropEl.classList.add('is-open');
                document.body.classList.add('panel-open');
                panelOpen = true;
                panelCloseEl.focus();
            });
        }

        function renderIdeas() {
            closePanel();

            const filteredIdeas = filterIdeas();
            const grid = document.getElementById('ideasGrid');
            const resultsCount = document.getElementById('resultsCount');

            resultsCount.textContent = `${filteredIdeas.length} ${filteredIdeas.length === 1 ? 'idea' : 'ideas'}`;

            if (filteredIdeas.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h2>No ideas found</h2>
                        <p>Try adjusting your search or filters.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredIdeas.map(idea => `
                <article class="idea-card" data-idea-id="${escapeHtml(idea.id)}">
                    <div class="card-face">
                        <div class="card-header">
                            <h2 class="idea-title">${escapeHtml(idea.title)}</h2>
                            <span class="status-badge status-${idea.status}">${escapeHtml(getStatusLabel(idea.status))}</span>
                        </div>
                        <p class="idea-summary">${escapeHtml(idea.summary)}</p>
                        <button type="button" class="read-more-btn" data-open-idea="${escapeHtml(idea.id)}">Read more</button>
                    </div>
                </article>
            `).join('');
        }

        async function copyPrompt(button, ideaId) {
            const idea = allIdeas.find(i => i.id === ideaId);
            if (!idea) return;

            try {
                await navigator.clipboard.writeText(idea.jumpstartPrompt);
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('copied');

                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
            } catch (error) {
                console.error('Failed to copy:', error);
                alert('Failed to copy to clipboard. Please copy manually.');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentFilters.search = e.target.value;
            document.getElementById('clearSearch').hidden = !e.target.value;
            renderIdeas();
        });

        document.getElementById('clearSearch').addEventListener('click', () => {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            currentFilters.search = '';
            document.getElementById('clearSearch').hidden = true;
            renderIdeas();
            searchInput.focus();
        });

        document.getElementById('statusFilters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('#statusFilters .filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                });
                e.target.classList.add('active');
                e.target.setAttribute('aria-pressed', 'true');
                currentFilters.status = e.target.dataset.status;
                renderIdeas();
            }
        });

        document.getElementById('tagFilters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('#tagFilters .filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                });
                e.target.classList.add('active');
                e.target.setAttribute('aria-pressed', 'true');
                currentFilters.tag = e.target.dataset.tag;
                renderIdeas();
            }
        });

        document.getElementById('ideasGrid').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-open-idea]');
            if (!btn) return;
            openPanel(btn.dataset.openIdea);
        });

        panelCloseEl.addEventListener('click', closePanel);
        backdropEl.addEventListener('click', closePanel);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && panelOpen) {
                e.preventDefault();
                closePanel();
            }
            trapPanelFocus(e);
        });

        panelEl.addEventListener('click', (e) => {
            const copyBtn = e.target.closest('[data-copy-prompt]');
            if (copyBtn) {
                copyPrompt(copyBtn, copyBtn.dataset.ideaId);
            }
        });

        loadIdeas();
    </script>
</body>
</html>
