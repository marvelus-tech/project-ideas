name: RevEDU static site

on:
  push:
    branches: [main]
    paths:
      - 'apps/pebble-crossing/**'
      - 'revedu/**'
      - 'pebble-crossing/**'
      - '.github/workflows/revedu-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pebble-crossing/package-lock.json
      - name: Build for project-ideas Pages subpath
        working-directory: apps/pebble-crossing
        env:
          VITE_PAGES_BASE: /project-ideas/revedu/
        run: |
          npm ci
          npm run build
          npm run test
      - name: Copy dist to repo root revedu/
        run: |
          rm -rf revedu
          mkdir -p revedu
          cp -r apps/pebble-crossing/dist/. revedu/
          touch revedu/.nojekyll
      - name: Keep legacy pebble-crossing URL redirects
        run: |
          rm -rf pebble-crossing
          mkdir -p pebble-crossing/play pebble-crossing/parent
          cp apps/pebble-crossing/legacy-pebble-crossing-redirects/index.html pebble-crossing/index.html
          cp apps/pebble-crossing/legacy-pebble-crossing-redirects/play.html pebble-crossing/play/index.html
          cp apps/pebble-crossing/legacy-pebble-crossing-redirects/parent.html pebble-crossing/parent/index.html
      - name: Commit deploy bundle if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revedu pebble-crossing
          git diff --staged --quiet || git commit -m "chore(pages): refresh revedu static deploy"
          git push