name: Pebble Crossing static site

on:
  push:
    branches: [main]
    paths:
      - 'apps/pebble-crossing/**'
      - 'pebble-crossing/**'
      - '.github/workflows/pebble-crossing-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pebble-crossing/package-lock.json
      - name: Build for project-ideas Pages subpath
        working-directory: apps/pebble-crossing
        env:
          VITE_PAGES_BASE: /project-ideas/pebble-crossing/
        run: |
          npm ci
          npm run build
          npm run test
      - name: Copy dist to repo root pebble-crossing/
        run: |
          rm -rf pebble-crossing
          mkdir -p pebble-crossing
          cp -r apps/pebble-crossing/dist/. pebble-crossing/
          touch pebble-crossing/.nojekyll
      - name: Commit deploy bundle if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pebble-crossing
          git diff --staged --quiet || git commit -m "chore(pages): refresh pebble-crossing static deploy"
          git push